<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gonkbrain.org</title>
<meta name="description" content="gonkbrain.org. Home of The Floor, a costed universal guarantee of housing, food, medical care and education.">
<link rel="canonical" href="https://gonkbrain.org/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--ink:#15171C;--quiet:#4A4F58;--accent:#1E4ED8;--paper:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:22px 16px 40px}
.top{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--quiet)}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(56px,12vw,120px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;margin:18px 0 0;color:var(--ink)}
.item{margin-top:40px;border-top:2px solid var(--ink);padding-top:14px;max-width:760px}
.item a.t{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:clamp(32px,6vw,52px);font-weight:700;line-height:1;text-transform:uppercase;color:var(--accent);text-decoration:none}
.item a.t:hover{color:var(--ink)}
.item p{margin:10px 0 0;font-size:19px;font-style:italic;text-wrap:balance}
footer{max-width:1000px;width:100%;margin:0 auto;padding:16px 16px 32px;border-top:2px solid var(--ink);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
</style>
</head>
<body>
<main>
<div class="top">gonkbrain.org</div>
<h1>Gonk.</h1>
<div class="item">
<a class="t" href="/floor/">The Floor</a>
<p>A society rich enough to prevent destitution has no right to use destitution as leverage. A universal guarantee of housing, food, medical care and education, costed and funded. Public domain.</p>
</div>

</main>
<footer>gonkbrain.org</footer>
</body>
</html>
